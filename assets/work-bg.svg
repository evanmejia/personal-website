<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
    <defs>
        <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#312e81" />
            <stop offset="0.55" stop-color="#3b2d7f" />
            <stop offset="1" stop-color="#4a1d96" />
        </linearGradient>
        <radialGradient id="blob-indigo">
            <stop offset="0" stop-color="#6366f1" stop-opacity="0.95" />
            <stop offset="1" stop-color="#6366f1" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="blob-violet">
            <stop offset="0" stop-color="#a855f7" stop-opacity="0.9" />
            <stop offset="1" stop-color="#a855f7" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="blob-pink">
            <stop offset="0" stop-color="#f472b6" stop-opacity="0.5" />
            <stop offset="1" stop-color="#f472b6" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="blob-amber">
            <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55" />
            <stop offset="1" stop-color="#fbbf24" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="blob-teal">
            <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.85" />
            <stop offset="1" stop-color="#2dd4bf" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="blob-cyan">
            <stop offset="0" stop-color="#22d3ee" stop-opacity="0.8" />
            <stop offset="1" stop-color="#22d3ee" stop-opacity="0" />
        </radialGradient>
        <filter id="grain" x="0" y="0" width="100%" height="100%">
            <feTurbulence
                type="fractalNoise"
                baseFrequency="0.8"
                numOctaves="2"
                stitchTiles="stitch"
            />
            <feColorMatrix type="saturate" values="0" />
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.06" />
            </feComponentTransfer>
        </filter>
    </defs>
    <rect width="1600" height="900" fill="url(#base)" />
    <circle cx="300" cy="220" r="640" fill="url(#blob-indigo)" />
    <circle cx="1380" cy="240" r="620" fill="url(#blob-violet)" />
    <circle cx="1050" cy="120" r="400" fill="url(#blob-pink)" />
    <circle cx="880" cy="440" r="380" fill="url(#blob-amber)" />
    <circle cx="420" cy="820" r="660" fill="url(#blob-teal)" />
    <circle cx="1240" cy="740" r="540" fill="url(#blob-cyan)" />
    <rect width="1600" height="900" filter="url(#grain)" />
</svg>
